apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: prisma-migration
          image: leffatsaid/projectspi-backend:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: projectspi-secrets
                  key: DATABASE_URL
      containers:
        - name: backend
          image: leffatsaid/projectspi-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: projectspi-secrets
                  key: DATABASE_URL
            - name: API_TRANS
              valueFrom:
                secretKeyRef:
                  name: projectspi-secrets
                  key: API_TRANS
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: projectspi-secrets
                  key: HF_TOKEN
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
